<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Final DAW</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div id="landscape">
      <div id="cover">
        <img
          src="./img/gameboy-pixelated-transparent-cropped.png"
          alt="gameboy advance"
          id="cover-image"
        />
        <div id="cover-title">
          <h1 id="title">
            <span id="red">R</span>
            etro <br />
            <span id="green">G</span>
            aming <br />
            <span id="blue">B</span>
            aby
          </h1>
          <p id="description">
            All your childhood favourite consoles in one place!
          </p>
          <br />
          <a id="button-redirection" href="#content">Explore more!</a>
        </div>
      </div>
    </div>
    <div id="content">
      <div id="products-content">
        <div id="categories">
          <button class="category-button gameboyButton" id="1">GAME BOY</button>
          <button class="category-button xboxButton" id="2">
            <span id="xbox-green">XBOX</span> <span id="xbox-grey">360</span>
          </button>
          <button class="category-button playstationButton" id="3">
            PlayStation 2
          </button>
        </div>
        <div id="pagination"></div>
        <div id="arrows">
          <button id="arrowLeft"><</button>
          <p id="pageNumber"></p>
          <button id="arrowRight">></button>
        </div>
      </div>
    </div>
  </body>
</html>
